      teal secondary (matches the locked logo's own ink exactly), GitHub-Actions-native
      success/pending/idle/danger status roles. IBM Plex Sans for UI text, IBM Plex Mono

      Committed light, not dark: the locked logo mark is dark-teal ink drawn for a light
      ground, so light-first is both truer to the asset and to GitHub Actions/CircleCI's
