[project]
name = "job-scrapper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.19.1",
    "apify-client[brotli]>=3.1.3",
    "apscheduler>=3.11.3",
    "fastapi>=0.141.1",
    "fpdf2>=2.8.8",
    "google-generativeai>=0.8.6",
    "greenlet>=3.5.5",
    "httpx>=0.28.1",
    "langchain-core>=1.6.0",
    "langchain-google-genai>=4.3.5",
    "langchain-ollama>=1.1.0",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.15.0",
    "pymupdf4llm>=1.28.2",
    "pypdf>=6.16.2",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyright>=1.1.411",
    "ruff>=0.16.4",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["backend", "scripts", "main.py"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "backend"]
