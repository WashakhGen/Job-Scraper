services:
  backend:
    build: .
    container_name: job-scrapper
    restart: unless-stopped
    ports:
      - "${UVICORN_PORT:-8888}:8888"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////app/data/jobscrapper.db
      CV_UPLOAD_DIR: /app/data/media/cvs
      LOG_DIR: /app/data/logs
      TZ: ${TZ:-UTC}
    volumes:
      - job-scrapper-data:/app/data
      # separate from your host's ~/.claude on purpose: macOS stores Claude
      # Code's login in Keychain, not in that folder, so a container can't
      # inherit it. Run `docker exec -it -u appuser job-scrapper claude login`
      # once after first start; it persists here across rebuilds.
      - claude-config:/home/appuser/.claude

volumes:
  job-scrapper-data:
  claude-config:
